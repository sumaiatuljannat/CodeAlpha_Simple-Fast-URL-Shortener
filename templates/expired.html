<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expired - LinkSnap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="error-page-body">
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon-badge warning">⏳</div>
            <h1 class="error-title">Link Has Expired</h1>
            <p class="error-description">
                The short link <code>/{{ short_code }}</code> was configured with an expiration date that has now passed.
            </p>
            {% if expires_at %}
            <div class="info-pill">
                Expired at: <strong>{{ expires_at }}</strong>
            </div>
            {% endif %}
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Create a New Short Link &rarr;</a>
            </div>
        </div>
    </div>
</body>
</html>
